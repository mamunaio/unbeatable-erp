services:
  # ----------------------------------------------------------------------------
  # 1. MySQL 8 Database Service
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: unbeatable_erp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: unbeatable_erp
      MYSQL_USER: erp_user
      MYSQL_PASSWORD: erp_password123
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - erp_network

  # ----------------------------------------------------------------------------
  # 2. Unbeatable ERP Next.js Application
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unbeatable_erp_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://erp_user:erp_password123@db:3306/unbeatable_erp"
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - erp_network

  # ----------------------------------------------------------------------------
  # 3. Nginx Reverse Proxy & Load Balancer
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: unbeatable_erp_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - erp_network

  # ----------------------------------------------------------------------------
  # 4. Optional phpMyAdmin (Database Management Tool)
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: unbeatable_erp_pma
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword123
    ports:
      - "8080:80"
    networks:
      - erp_network

# ------------------------------------------------------------------------------
# Persistent Volumes & Network Definitions
# ------------------------------------------------------------------------------
volumes:
  db_data:
    driver: local

networks:
  erp_network:
    driver: bridge
